version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: finstatements
      POSTGRES_PASSWORD: finstatements_dev
      POSTGRES_DB: finstatements
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finstatements']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql://finstatements:finstatements_dev@db:5432/finstatements
      SECRET_KEY: change-this-in-production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEBUG: 'false'
    volumes:
      - uploads_data:/app/uploads
      - exports_data:/app/exports
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
  exports_data:
